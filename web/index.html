<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bonsai Dojo 树境·盆景道 | 典藏物理与造形工作室</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f2f0eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #2b2622;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
    }
    /* 典雅极简悬浮半透玻璃面板 */
    .hud-card {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(220, 215, 205, 0.85);
      border-radius: 14px;
      padding: 16px 20px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 10px 32px rgba(60, 45, 30, 0.08);
      z-index: 10;
      pointer-events: auto;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .hud-card.collapsed {
      max-height: 48px !important;
      overflow: hidden !important;
      padding: 10px 16px !important;
      opacity: 0.85;
    }
    .hud-card.collapsed .collapsible-content {
      display: none !important;
    }
    #hud-panel {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 290px;
    }
    #coach-panel {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 320px;
      max-height: calc(100vh - 48px);
      overflow-y: auto;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .season-spring { background: #eaf4e2; color: #3a721c; border: 1px solid #c2e2ab; }
    .season-summer { background: #e5f5fa; color: #0284c7; border: 1px solid #bae6fd; }
    .season-autumn { background: #fdf2e9; color: #c25e1a; border: 1px solid #fed7aa; }
    .season-winter { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
    
    .coach-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .pill-ok { background: #eaf4e2; color: #3a721c; border: 1px solid #c2e2ab; }
    .pill-warning { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .pill-danger { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }

    .panel-toggle-btn {
      background: none;
      border: none;
      font-size: 14px;
      cursor: pointer;
      color: #786f66;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background 0.15s ease;
    }
    .panel-toggle-btn:hover {
      background: rgba(0,0,0,0.06);
      color: #2b2622;
    }

    .btn {
      width: 100%;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: #3a721c;
      color: #fff;
      border: 1px solid #2f5e16;
      box-shadow: 0 2px 8px rgba(58, 114, 28, 0.25);
    }
    .btn-primary:hover { background: #448621; }
    .btn-secondary {
      background: #fdfcf9;
      color: #4a3e35;
      border: 1px solid #ded8ce;
    }
    .btn-secondary:hover { background: #f3efe8; border-color: #cbbead; }
    .btn-secondary.active {
      background: #eef2ff;
      border-color: #a5b4fc;
      color: #4338ca;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #6c635b;
      margin-bottom: 6px;
    }
    .stat-val { font-weight: 600; color: #2e2824; }
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #e8e2d8;
      border-radius: 999px;
      overflow: hidden;
      margin: 6px 0 14px 0;
    }
    .progress-bar-fill {
      height: 100%;
      background: #3a721c;
      width: 100%;
      transition: width 0.3s ease;
    }
    .progress-bar-fill.low { background: #e11d48; }

    /* 教练审计卡片 */
    .coach-card {
      background: #ffffff;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      border: 1px solid #e8e2d8;
      font-size: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .coach-card.severity-Danger { border-left: 4px solid #ef4444; }
    .coach-card.severity-Warning { border-left: 4px solid #f59e0b; }
    .coach-card.severity-Info { border-left: 4px solid #22c55e; }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .rule-tag {
      font-family: monospace;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
    }
    .severity-badge {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 999px;
      font-weight: 600;
    }
    .severity-badge.Danger { background: #fee2e2; color: #991b1b; }
    .severity-badge.Warning { background: #fef3c7; color: #92400e; }
    .severity-badge.Info { background: #dcfce7; color: #166534; }
    .card-detail {
      font-size: 12px;
      color: #334155;
      line-height: 1.45;
      margin-bottom: 6px;
    }
    .card-evidence-btn {
      width: 100%;
      padding: 4px 8px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .card-evidence-btn:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
      color: #0f172a;
    }
    .coach-empty {
      text-align: center;
      padding: 24px 12px;
      color: #64748b;
      font-size: 13px;
    }
    .coach-empty-icon {
      font-size: 28px;
      margin-bottom: 6px;
    }

    #tips {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(220, 215, 205, 0.85);
      border-radius: 30px;
      padding: 7px 20px;
      font-size: 12px;
      color: #5c534a;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- 左侧控制台 -->
  <div id="hud-panel" class="hud-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h3 style="font-size: 15px; font-weight: 700; color: #2e2824; letter-spacing: -0.01em;">Bonsai Dojo 盆景道</h3>
      <div style="display: flex; align-items: center; gap: 6px;">
        <span id="season-badge" class="badge season-spring">春 · 第 1 年</span>
        <button id="btn-toggle-hud" class="panel-toggle-btn" title="折叠/展开面板">− / ＋</button>
      </div>
    </div>

    <div class="collapsible-content">
      <div class="stat-row">
        <span>能量池蓄积 (Energy Pool)</span>
        <span id="stat-energy" class="stat-val">100.0</span>
      </div>
      <div class="progress-bar-bg">
        <div id="energy-bar" class="progress-bar-fill"></div>
      </div>

      <button id="btn-grow-season" class="btn btn-primary">
        <span>🌱 推进生长季 (Advance Season)</span>
      </button>
      <button id="btn-toggle-skeleton" class="btn btn-secondary">
        <span>透视骨架 / 真实树貌</span>
      </button>
      <button id="btn-reset" class="btn btn-secondary" style="margin-bottom: 14px;">
        <span>重置盆景 (Reset Bonsai)</span>
      </button>

      <div style="border-top: 1px solid #e8e2d8; padding-top: 10px;">
        <div class="stat-row">
          <span>枝段总数 (Segments)</span>
          <span id="stat-segments" class="stat-val">35</span>
        </div>
        <div class="stat-row">
          <span>树龄年轮 (Tree Age)</span>
          <span id="stat-age" class="stat-val">第 1 年</span>
        </div>
        <div class="stat-row">
          <span>累积修剪量 (Total Pruned)</span>
          <span id="stat-pruned" class="stat-val">0</span>
        </div>
        <div class="stat-row">
          <span>渲染外观 (Render Mode)</span>
          <span id="stat-mode" class="stat-val">Organic Trunk</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 右侧教练审计诊断面板 -->
  <div id="coach-panel" class="hud-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <h4 style="font-size: 14px; font-weight: 700; color: #2e2824;">盆景流派与健康教练</h4>
      <div style="display: flex; align-items: center; gap: 6px;">
        <span id="coach-status-pill" class="coach-pill pill-ok">平衡良好</span>
        <button id="btn-toggle-coach" class="panel-toggle-btn" title="折叠/展开面板">− / ＋</button>
      </div>
    </div>
    <div class="collapsible-content">
      <p style="font-size: 11px; color: #786f66; margin-bottom: 10px;">Wiki 比例与造型准则实时审计</p>
      <div id="coach-issues-list">
        <!-- 动态插入诊断卡片 -->
      </div>
    </div>
  </div>

  <div id="tips">
    🖱️ 点击枝条执行精准修剪 · 左键拖拽 360° 鉴赏 · 右键平移 · 滚轮缩放
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>

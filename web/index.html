<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bonsai Dojo - Interactive Bonsai Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1e22;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #e2e8f0;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
    }
    #hud-panel {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
      width: 320px;
      background: rgba(18, 22, 28, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .hud-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
    }
    .hud-header h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #f8fafc;
    }
    .hud-header .badge {
      font-size: 0.7rem;
      font-weight: 500;
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .hud-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .btn {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }
    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
    .btn-primary:active {
      transform: translateY(0);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .btn-secondary:active {
      transform: translateY(0);
    }
    .btn.active {
      background: #059669;
      color: #ffffff;
      border-color: #10b981;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }
    #stats {
      font-size: 0.8rem;
      line-height: 1.6;
      color: #94a3b8;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    #stats .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    #stats .stat-val {
      color: #f1f5f9;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .hud-tip {
      margin-top: 10px;
      font-size: 0.75rem;
      color: #64748b;
      line-height: 1.4;
    }
    .hud-tip span {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="hud-panel">
    <div class="hud-header">
      <h1>Bonsai Dojo 盆栽道場</h1>
      <span class="badge">WASM CORE</span>
    </div>
    <div class="hud-controls">
      <button id="btn-toggle-skeleton" class="btn btn-secondary">
        Toggle Skeleton View (骨架透视)
      </button>
      <button id="btn-reset" class="btn btn-primary">
        Reset Bonsai (重置树形)
      </button>
    </div>
    <div id="stats">
      <div class="stat-row">
        <span>Segments (枝段数):</span>
        <span id="stat-segments" class="stat-val">0</span>
      </div>
      <div class="stat-row">
        <span>Pruned Total (累计修剪):</span>
        <span id="stat-pruned" class="stat-val">0</span>
      </div>
      <div class="stat-row">
        <span>Rendering Mode:</span>
        <span id="stat-mode" class="stat-val">Organic Trunk</span>
      </div>
    </div>
    <div class="hud-tip">
      * Click on any branch to <span>prune (修剪)</span>.<br/>
      * Left click + drag to rotate view.<br/>
      * Right click + drag to pan, wheel to zoom.
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>

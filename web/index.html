<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bonsai Dojo - Interactive Bonsai Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1e22;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #e2e8f0;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
    }
    #hud-panel {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
      width: 320px;
      background: rgba(18, 22, 28, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .hud-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
    }
    .hud-header h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #f8fafc;
    }
    .hud-header .badge {
      font-size: 0.75rem;
      font-weight: 500;
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      white-space: nowrap;
      transition: all 0.3s ease;
    }
    .badge.season-spring {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border-color: rgba(74, 222, 128, 0.35);
    }
    .badge.season-summer {
      background: rgba(234, 179, 8, 0.2);
      color: #facc15;
      border-color: rgba(250, 204, 21, 0.35);
    }
    .badge.season-autumn {
      background: rgba(249, 115, 22, 0.2);
      color: #fb923c;
      border-color: rgba(251, 146, 60, 0.35);
    }
    .badge.season-winter {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.35);
    }
    .energy-section {
      margin-bottom: 14px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .energy-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .energy-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .energy-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981 0%, #06b6d4 100%);
      border-radius: 4px;
      transition: width 0.4s ease, background 0.4s ease;
    }
    .energy-fill.low {
      background: linear-gradient(90deg, #ef4444 0%, #f59e0b 100%);
    }
    .hud-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .btn {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-grow {
      background: linear-gradient(135deg, #059669 0%, #0d9488 100%);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(13, 148, 136, 0.3);
      font-weight: 600;
    }
    .btn-grow:hover {
      background: linear-gradient(135deg, #047857 0%, #0f766e 100%);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.4);
    }
    .btn-grow:active {
      transform: translateY(0);
    }
    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }
    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
    .btn-primary:active {
      transform: translateY(0);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .btn-secondary:active {
      transform: translateY(0);
    }
    .btn.active {
      background: #059669;
      color: #ffffff;
      border-color: #10b981;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }
    #stats {
      font-size: 0.8rem;
      line-height: 1.6;
      color: #94a3b8;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    #stats .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    #stats .stat-val {
      color: #f1f5f9;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .hud-tip {
      margin-top: 10px;
      font-size: 0.75rem;
      color: #64748b;
      line-height: 1.4;
    }
    .hud-tip span {
      color: #38bdf8;
    }

    /* --- Coach Diagnostics Panel (Top-Right) --- */
    #coach-panel {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 10;
      width: 360px;
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      background: rgba(18, 22, 28, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }
    .coach-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
    }
    .coach-title-wrap h2 {
      font-size: 1.05rem;
      font-weight: 600;
      color: #f8fafc;
      letter-spacing: 0.5px;
    }
    .coach-subtitle {
      font-size: 0.7rem;
      color: #94a3b8;
    }
    .coach-pill {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      letter-spacing: 0.5px;
    }
    .pill-ok {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.3);
    }
    .pill-warning {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }
    .pill-danger {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(248, 113, 113, 0.3);
    }
    .coach-issues-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .coach-card {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 12px;
      border-left: 3px solid #3b82f6;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .coach-card:hover {
      background: rgba(255, 255, 255, 0.05);
      transform: translateX(-2px);
    }
    .coach-card.severity-Danger {
      border-left-color: #ef4444;
    }
    .coach-card.severity-Warning {
      border-left-color: #f59e0b;
    }
    .coach-card.severity-Info {
      border-left-color: #10b981;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .rule-tag {
      font-size: 0.72rem;
      font-family: ui-monospace, monospace;
      font-weight: 600;
      color: #cbd5e1;
    }
    .severity-badge {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
    }
    .severity-badge.Danger {
      background: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
    }
    .severity-badge.Warning {
      background: rgba(245, 158, 11, 0.25);
      color: #fde68a;
    }
    .severity-badge.Info {
      background: rgba(16, 185, 129, 0.25);
      color: #a7f3d0;
    }
    .card-detail {
      font-size: 0.78rem;
      color: #cbd5e1;
      line-height: 1.45;
    }
    .card-evidence-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
      font-size: 0.7rem;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 4px;
      padding: 3px 7px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .card-evidence-btn:hover {
      background: rgba(56, 189, 248, 0.2);
    }
    .coach-empty {
      font-size: 0.8rem;
      color: #94a3b8;
      text-align: center;
      padding: 20px 0;
      line-height: 1.5;
    }
    .coach-empty-icon {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- HUD Control Panel (Left) -->
  <div id="hud-panel">
    <div class="hud-header">
      <h1>Bonsai Dojo 盆栽道場</h1>
      <span id="season-badge" class="badge season-spring">春 · 第 1 年</span>
    </div>

    <!-- Energy Pool Bar -->
    <div class="energy-section">
      <div class="energy-header">
        <span>能量池 (Energy Pool)</span>
        <span id="stat-energy" class="stat-val">100.0</span>
      </div>
      <div class="energy-track">
        <div id="energy-bar" class="energy-fill" style="width: 100%;"></div>
      </div>
    </div>

    <!-- Controls -->
    <div class="hud-controls">
      <button id="btn-grow-season" class="btn btn-grow">
        <span>🌱</span> 推进生长季 (Advance Season)
      </button>
      <button id="btn-toggle-skeleton" class="btn btn-secondary">
        Toggle Skeleton View (骨架透视)
      </button>
      <button id="btn-reset" class="btn btn-primary">
        Reset Bonsai (重置树形)
      </button>
    </div>

    <!-- Stats -->
    <div id="stats">
      <div class="stat-row">
        <span>Segments (枝段数):</span>
        <span id="stat-segments" class="stat-val">0</span>
      </div>
      <div class="stat-row">
        <span>Pruned Total (累计修剪):</span>
        <span id="stat-pruned" class="stat-val">0</span>
      </div>
      <div class="stat-row">
        <span>Tree Age (树龄):</span>
        <span id="stat-age" class="stat-val">第 1 年</span>
      </div>
      <div class="stat-row">
        <span>Rendering Mode:</span>
        <span id="stat-mode" class="stat-val">Organic Trunk</span>
      </div>
    </div>

    <div class="hud-tip">
      * Click on branch to <span>prune (修剪)</span>.<br/>
      * Click <span>推进生长季</span> to simulate seasonal flush.<br/>
      * Left drag rotate, right drag pan, wheel zoom.
    </div>
  </div>

  <!-- Bonsai Coach Diagnostics Panel (Right) -->
  <div id="coach-panel">
    <div class="coach-header">
      <div class="coach-title-wrap">
        <h2>盆栽教练诊断</h2>
        <span class="coach-subtitle">Wiki 比例与造型实时审计</span>
      </div>
      <span id="coach-status-pill" class="coach-pill pill-ok">平衡良好</span>
    </div>
    <div id="coach-issues-list" class="coach-issues-list">
      <!-- Populated dynamically by main.ts -->
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
